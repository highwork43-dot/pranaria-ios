name: Pranaria
options:
  bundleIdPrefix: ru.melstudio.pranaria.personal
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"   # допустимые значения: 4, 4.2, 5, 6
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

targets:
  Pranaria:
    type: application
    platform: iOS
    sources:
      # Ядро (Foundation-only, тестируется на Linux) и iOS-слой (SwiftUI)
      # компилируются в один модуль приложения.
      - path: Sources/PranariaCore
      - path: Sources/PranariaApp
        excludes:
          - "Resources/Info.plist"
      # Контент, извлечённый из оригинального APK (копируется в корень бандла).
      - path: Content/Audio
        type: group
        buildPhase: resources
      - path: Content/Images
        type: group
        buildPhase: resources
      - path: Content/programs.json
        buildPhase: resources
      - path: Content/achievements.json
        buildPhase: resources
      - path: Content/license.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.melstudio.pranaria.personal
        PRODUCT_NAME: Pranaria   # отображаемое имя задаётся в Info.plist (CFBundleDisplayName)
        INFOPLIST_FILE: Sources/PranariaApp/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: YES
        GENERATE_INFOPLIST_FILE: NO

schemes:
  Pranaria:
    build:
      targets:
        Pranaria: all
    run:
      config: Debug
    archive:
      config: Release
