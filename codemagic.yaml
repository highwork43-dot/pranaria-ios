# Запасной вариант CI: Codemagic (бесплатный тариф, macOS-сборка).
#
# Нужен аккаунт codemagic.io (привязка GitHub) — тогда workflow запускается
# автоматически при пуше в main, а .ipa скачивается из дашборда.
#
# Требуется XcodeGen — ставится через brew в build phase.

ios_workflow:
  name: Pranaria iOS
  instance_type: mac_mini_m2
  max_build_duration: 30

  environment:
    ios_signing: {}

  scripts:
    - name: Установить XcodeGen
      script: |
        brew install xcodegen
    - name: Сгенерировать проект
      script: |
        xcodegen generate
    - name: Сборка Release
      script: |
        set -euo pipefail
        xcodebuild \
          -project Pranaria.xcodeproj \
          -scheme Pranaria \
          -configuration Release \
          -sdk iphoneos \
          -destination 'generic/platform=iOS' \
          -derivedDataPath build/DerivedData \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          build
    - name: Упаковать .ipa
      script: |
        set -euo pipefail
        mkdir -p build/Payload
        APP=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
        cp -R "$APP" build/Payload/
        cd build && zip -qry Pranaria-unsigned.ipa Payload

  artifacts:
    - path: build/Pranaria-unsigned.ipa
      name: Pranaria-unsigned-ipa

  test:
    test_script: |
      set -euo pipefail
      swift test

  triggers:
    push:
      branches:
        - main
